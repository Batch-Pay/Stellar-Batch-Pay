name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify package entry points exist
        run: node scripts/verify-exports.js

      - name: Validate package with npm pack
        run: npm pack --dry-run

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
        env:
          CI: 'true'

      - name: Run ESLint
        run: npm run lint
        env:
          CI: 'true'

      - name: Run Vitest suite
        run: npm run test
        env:
          CI: 'true'

      - name: Validate environment configuration
        run: npm run validate:env

  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build Next.js application
        run: npm run build
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          ALLOW_SERVER_SIGNING: 'false'
          SECRET_BACKEND: 'env'
