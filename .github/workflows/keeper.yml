name: Keeper Bot

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Install all dependencies (including devDependencies) so that tsx,
      # which is a devDependency, is available to execute the keeper script.
      # --only=production was the original bug: it skips devDeps, making
      # the npx tsx call fail with "command not found".
      - name: Install dependencies
        run: npm ci

      # Fail loudly before doing any work if the secrets the keeper needs
      # are not configured.  An empty CONTRACT_ID means the bot would silently
      # target no contract; an empty KEEPER_SECRET means it cannot sign txs.
      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "$CONTRACT_ID"    ]] && missing+=("CONTRACT_ID")
          [[ -z "$KEEPER_SECRET"  ]] && missing+=("KEEPER_SECRET")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: required secret(s) not set: ${missing[*]}" >&2
            echo "Set them under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
        env:
          CONTRACT_ID: ${{ secrets.CONTRACT_ID }}
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}

      # Restore the per-recipient pagination cursor from the previous run.
      # The artifact is keyed on the workflow + contract so different
      # environments (testnet vs mainnet) never share state.
      # A cache-miss (first run, or after retention expires) is fine — the
      # keeper initialises an empty state object and starts from index 0.
      - name: Restore keeper state
        uses: actions/download-artifact@v4
        with:
          name: keeper-state-${{ secrets.CONTRACT_ID }}
          path: ./data
        continue-on-error: true

      - name: Run keeper bot
        env:
          SECRET_BACKEND: github
          KEEPER_SECRET: ${{ secrets.KEEPER_SECRET }}
          SOROBAN_RPC_URL: ${{ secrets.SOROBAN_RPC_URL || 'https://soroban-testnet.stellar.org' }}
          NETWORK_PASSPHRASE: ${{ secrets.NETWORK_PASSPHRASE || 'Test SDF Network ; September 2015' }}
          CONTRACT_ID: ${{ secrets.CONTRACT_ID }}
          MAINTENANCE_LIMIT: ${{ vars.MAINTENANCE_LIMIT || '10' }}
          KEEPER_STATE_PATH: ./data/keeper-state.json
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          LOW_BALANCE_THRESHOLD: ${{ vars.LOW_BALANCE_THRESHOLD || '50' }}
        run: npx tsx scripts/keeper.ts

      # Upload the updated state so the next scheduled run can resume
      # pagination from where this run left off.  The artifact is uploaded
      # even when the keeper step fails (if: always()) so a transient RPC
      # error mid-run does not lose the cursor progress that was saved.
      - name: Upload keeper state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keeper-state-${{ secrets.CONTRACT_ID }}
          path: ./data/keeper-state.json
          # Retain for 90 days — well beyond the 6-hour cron cadence.
          retention-days: 90
          if-no-files-found: ignore

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const issueNumber = context.issue?.number;

            // Write job summary so the failure reason is visible in the Actions UI.
            const summary = [
              '## ❌ Keeper Bot Failure',
              '',
              `| Field | Value |`,
              `| ----- | ----- |`,
              `| Run | [${context.runId}](${runUrl}) |`,
              `| Contract | \`${process.env.CONTRACT_ID || 'N/A'}\` |`,
              `| Schedule | \`${context.event?.schedule || 'manual'}\` |`,
              '',
              'Check the **Run keeper bot** step logs for the full error.',
            ].join('\n');
            core.summary.addRaw(summary);
            await core.summary.write();

            if (issueNumber) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `❌ Keeper bot workflow failed. Check the [workflow run](${runUrl}) for details.`
              });
            } else {
              const title = 'Keeper Bot Failure';
              const { data: issues } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                per_page: 100
              });

              const existingIssue = issues.find(issue => issue.title === title);

              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  body: `❌ Keeper bot workflow failed again. Check the [workflow run](${runUrl}) for details.`
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body: `❌ Keeper bot workflow failed. Check the [workflow run](${runUrl}) for details.`
                });
              }
            }
