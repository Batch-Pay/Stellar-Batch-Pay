version: '3.8'

services:
  stellar:
    # Pinned to a specific quickstart release so local Horizon/Soroban RPC
    # behavior is reproducible across machines. See DEVELOPMENT.md
    # ("Updating the stellar/quickstart pin") before bumping this tag.
    image: stellar/quickstart:23.0.6-2304
    container_name: stellar-quickstart
    ports:
      - "8000:8000" # Horizon
      - "8001:8001" # Soroban RPC
    command: >
      --standalone
      --enable-soroban-rpc
    volumes:
      - stellar-data:/opt/stellar
    networks:
      - stellar-network

  app:
    build: .
    container_name: stellar-batch-pay-app
    ports:
      - "3000:3000"
    environment:
      # These names must match what lib/stellar/network-config.ts and
      # lib/stellar/vesting-config.ts actually read (see .env.example) —
      # unprefixed names without a _TESTNET/_MAINNET/_FUTURENET suffix are
      # silently ignored by the resolvers, which then fall back to the
      # public SDF endpoints instead of this local quickstart node.
      - NEXT_PUBLIC_STELLAR_NETWORK=testnet
      # Server-side (container-to-container) endpoints.
      - HORIZON_URL_TESTNET=http://stellar:8000
      - SOROBAN_RPC_URL_TESTNET=http://stellar:8001
      # Client-side (browser-to-host) endpoints — the browser runs outside
      # the compose network, so it must reach the mapped host ports instead
      # of the "stellar" service hostname.
      - NEXT_PUBLIC_HORIZON_URL_TESTNET=http://localhost:8000
      - NEXT_PUBLIC_SOROBAN_RPC_URL_TESTNET=http://localhost:8001
      # Deploy the vesting contract to the local standalone network first
      # (see DEVELOPMENT.md), then export CONTRACT_ID_TESTNET in your shell
      # (or a .env file next to this compose file) before `docker compose
      # up`. Pages that resolve the vesting contract will error at request
      # time until this is set — see lib/stellar/vesting-config.ts.
      - CONTRACT_ID_TESTNET=${CONTRACT_ID_TESTNET:-}
      - NEXT_PUBLIC_CONTRACT_ID_TESTNET=${CONTRACT_ID_TESTNET:-}
      - NODE_ENV=production
    depends_on:
      - stellar
    volumes:
      - ./data:/app/data
    networks:
      - stellar-network

volumes:
  stellar-data:

networks:
  stellar-network:
    driver: bridge
